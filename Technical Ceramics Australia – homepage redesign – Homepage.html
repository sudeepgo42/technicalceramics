  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

22, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0}\na{color:#15171A}a:hover{color:#1C4F8F}\ndetails summary{cursor:pointer;list-style:none}\ndetails summary::-webkit-details-marker{display:none}\n@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}\n@keyframes fade{from{opacity:0}to{opacity:1}}\n@keyframes marquee{to{transform:translateX(-50%)}}\n@keyframes drift{from{transform:translateY(-9%) scale(1.2)}to{transform:translateY(9%) scale(1.2)}}\n@keyframes heroDrift{from{transform:translateY(0) scale(1.08)}to{transform:translateY(10%) scale(1.08)}}\n@keyframes rule{from{transform:scaleX(0)}to{transform:scaleX(1)}}\n.intro{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}\n.d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}.d4{animation-delay:.45s}\n.frame{overflow:hidden}\n.marquee-wrap{overflow:hidden;flex:1 1 400px;min-width:0}\n.marquee{display:flex;width:max-content;gap:0 40px;animation:marquee 45s linear infinite}\n.marquee-wrap:hover .marquee{animation-play-state:paused}\n.row{transition:background .25s ease,padding .25s ease}\n.row:hover{background:#F5F5F3;padding-left:12px!important;padding-right:12px!important}\n.row .arrow{display:inline-block;transition:transform .25s ease}\n.row:hover .arrow{transform:translateX(6px)}\n.zoom img{transition:transform .6s cubic-bezier(.2,.7,.2,1)}\n.zoom:hover img{transform:scale(1.06)}\n.btn{transition:background .2s ease,transform .2s ease}\n.btn:hover{transform:translateY(-2px)}\n@supports (animation-timeline: view()){\n.reveal{animation:rise linear both;animation-timeline:view();animation-range:entry 0% entry 45%}\n.para{animation:drift linear both;animation-timeline:view();animation-range:cover 0% cover 100%}\n.hero-para{animation:heroDrift linear both;animation-timeline:view();animation-range:exit 0% exit 100%}\n.grow{transform-origin:left;animation:rule linear both;animation-timeline:view();animation-range:entry 10% e 1fr)); gap: 24px 56px; margin-bottom: 40px; align-items: end\">\n      <h2 class=\"reveal\" style=\"margin: 0; font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 38px; letter-spacing: -0.02em; line-height: 1.1\">Parts we have made<\u002Fh2>\n      <p style=\"margin: 0; color: #3E4247; font-size: 17px\">A sample across alumina, zirconia, silicon carbide and boron nitride, from medical pump tubes to kiln rollers. Each one formed and finished to the customer's drawing.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 32px 24px\">\n      <sc-for list=\"{{parts}}\" as=\"part\" hint-placeholder-count=\"6\">\n        <figure class=\"reveal zoom\" style=\"margin: 0; display: flex; flex-direction: column; gap: 12px\">\n          <div class=\"frame\" style=\"aspect-ratio: 1 / 1; background: #E6E7E3\">\n            <img src=\"{{part.src}}\" alt=\"{{part.alt}}\" style=\"width: 100%; height: 100%; object-fit: cover; display: block\">\n          <\u002Fdiv>\n          <figcaption style=\"display: flex; justify-content: space-between; gap: 16px; border-top: 1px solid #D9DAD6; padding-top: 10px\">\n            <span style=\"font-weight: 600; font-size: 15px\">{{part.name}}<\u002Fspan>\n            <span style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #55595F\">{{part.material}}<\u002Fspan>\n          <\u002Ffigcaption>\n        <\u002Ffigure>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- Parallax band -->\n  <section class=\"frame\" style=\"position: relative; height: 560px; background: #15171A; color: #FFFFFF\">\n    <img class=\"para\" src=\"803d1e0a-2659-47bf-9dae-a4d52d61d886\" alt=\"\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.42\">\n    <div style=\"position: relative; max-width: 1240px; height: 100%; margin: 0 auto; padding: 64px 32px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; gap: 16px\">\n      <div class=\"reveal\" style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12.5px; letter-spacing: 0.08em; text-transform: uppercase; color: #D6DEE8\">Silicon carbide roller tubes, diamond-lapped<\u002Fdiv>\n      <p class=\"reveal\" style=\"margin: 0; font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 48px; line-height: 1.08; letter-spacing: -0.02em; max-width: 16em\">Formulated, pressed and fired under one roof. Answerable for every part we ship.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- Materials -->\n  <section id=\"materials\" style=\"background: #FFFFFF; border-top: 1px solid #D9DAD6; border-bottom: 1px solid #D9DAD6\">\n    <div style=\"max-width: 1240px; margin: 0 auto; padding: 88px 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 56px\">\n      <div style=\"display: flex; flex-direction: column; gap: 20px\">\n        <h2 class=\"reveal\" style=\"margin: 0; font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 38px; letter-spacing: -0.02em; line-height: 1.1\">We recommend the cheapest body that meets the spec.<\u002Fh2>\n        <p style=\"margin: 0; color: #3E4247; font-size: 17px\">Tell us the operating temperature, chemical environment, mechanical load, electrical requirements and budget. Our technical team will match it to one of 19 bodies, or formulate a new one with our mineral suppliers and labs.<\u002Fp>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 12px 28px; margin-top: 8px\">\n          <a href=\"#materials\" style=\"font-weight: 600; padding: 12px 0\">Materials guide →<\u002Fa>\n          <a id=\"brochure\" href=\"#brochure\" style=\"font-weight: 600; padding: 12px 0\">Download the brochure (PDF) →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #55595F; padding-bottom: 12px\">Ceramic bodies<\u002Fdiv>\n        <div class=\"grow\" style=\"height: 2px; background: #15171A\"><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); column-gap: 32px\">\n          <sc-for list=\"{{bodies}}\" as=\"b\" hint-placeholder-count=\"19\">\n            <div style=\"padding: 11px 0; border-bottom: 1px solid #E6E7E3; font-size: 15px\">{{b}}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- Industries -->\n  <section id=\"industries\" style=\"max-width: 1240px; margin: 0 auto; padding: 88px 32px\">\n    <h2 class=\"reveal\" style=\"margin: 0 0 40px; font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 38px; letter-spacing: -0.02em; line-height: 1.1\">Where our parts go<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 40px 32px\">\n      <div class=\"reveal\" style=\"border-top: 2px solid #15171A; padding-top: 18px; display: flex; flex-direction: column; gap: 10px\">\n        <h3 style=\"margin: 0; font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 21px\">Defence<\u002Fh3>\n        <p style=\"margin: 0; color: #3E4247; font-size: 15.5px\">Armour tiles, sensor housings and electrical isolation for Australian defence programs and primes. QA built for customers who do not accept rework.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"reveal\" style=\"border-top: 2px solid #15171A; padding-top: 18px; display: flex; flex-direction: column; gap: 10px\">\n        <h3 style=\"margin: 0; font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 21px\">Mining<\u002Fh3>\n        <p style=\"margin: 0; color: #3E4247; font-size: 15.5px\">Alumina liners, plates and cyclone parts for slurry, abrasion and impact. Sites supported across NSW, WA, Queensland and South Australia.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"reveal\" style=\"border-top: 2px solid #15171A; padding-top: 18px; display: flex; flex-direction: column; gap: 10px\">\n        <h3 style=\"margin: 0; font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 21px\">Aerospace<\u002Fh3>\n        <p style=\"margin: 0; color: #3E4247; font-size: 15.5px\">Precision-ground alumina, zirconia and nitride parts for thermal management, ignition, sensor housings and structural use.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"reveal\" style=\"border-top: 2px solid #15171A; padding-top: 18px; display: flex; flex-direction: column; gap: 10px\">\n        <h3 style=\"margin: 0; font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 21px\">Manufacturing<\u002Fh3>\n        <p style=\"margin: 0; color: #3E4247; font-size: 15.5px\">Kiln furniture, fixtures, refractories and ceramic tooling built for the duty cycle your line actually runs. Stocked locally, on lead time.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- Process -->\n  <section id=\"about\" style=\"background: #15171A; color: #F5F5F3\">\n    <div style=\"max-width: 1240px; margin: 0 auto; padding: 88px 32px\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px 56px; margin-bottom: 48px; align-items: end\">\n        <h2 class=\"reveal\" style=\"margin: 0; font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 38px; letter-spacing: -0.02em; line-height: 1.1\">From drawing to despatch<\u002Fh2>\n        <p style=\"margin: 0; color: #C9CBC7; font-size: 17px\">We design and control every body, tool and QA check, then match production to the right facility in Australia, India, China or the USA. Where a job needs Australian manufacture, we scope it that way.<\u002Fp>\n      <\u002Fdiv>\n      <ol style=\"list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 32px\">\n        <li class=\"reveal\" style=\"border-top: 1px solid #55595F; padding-top: 18px\">\n          <div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12.5px; color: #8FB2E0; margin-bottom: 10px\">Within 2 business days<\u002Fdiv>\n          <h3 style=\"margin: 0 0 8px; font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 20px\">Assess<\u002Fh3>\n          <p style=\"margin: 0; color: #C9CBC7; font-size: 15px\">Send drawings, samples, photos or a description of what is failing. We confirm whether ceramic suits the job.<\u002Fp>\n        <\u002Fli>\n        <li class=\"reveal\" style=\"border-top: 1px solid #55595F; padding-top: 18px\">\n          <div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12.5px; color: #8FB2E0; margin-bottom: 10px\">Engineering<\u002Fdiv>\n          <h3 style=\"margin: 0 0 8px; font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 20px\">Specify<\u002Fh3>\n          <p style=\"margin: 0; color: #C9CBC7; font-size: 15px\">We recommend the body, forming method and firing schedule that fit your run size and budget.<\u002Fp>\n        <\u002Fli>\n        <li class=\"reveal\" style=\"border-top: 1px solid #55595F; padding-top: 18px\">\n          <div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12.5px; color: #8FB2E0; margin-bottom: 10px\">Firm quote<\u002Fdiv>\n          <h3 style=\"margin: 0 0 8px; font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 20px\">Prototype<\u002Fh3>\n          <p style=\"margin: 0; color: #C9CBC7; font-size: 15px\">A fixed price with a realistic lead time. New geometries are prototyped and proven before volume tooling.<\u002Fp>\n        <\u002Fli>\n        <li class=\"reveal\" style=\"border-top: 1px solid #55595F; padding-top: 18px\">\n          <div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12.5px; color: #8FB2E0; margin-bottom: 10px\">QA before despatch<\u002Fdiv>\n          <h3 style=\"margin: 0 0 8px; font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 20px\">Produce<\u002Fh3>\n          <p style=\"margin: 0; color: #C9CBC7; font-size: 15px\">Dimensional and material checks on every batch. Re-orders are simple because the body and tooling are ours.<\u002Fp>\n        <\u002Fli>\n      <\u002Fol>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FAQ -->\n  <section id=\"tech\" style=\"max-width: 1240px; margin: 0 auto; padding: 88px 32px; display: flex; flex-wrap: wrap; gap: 40px 56px\">\n    <div style=\"flex: 1 1 320px\">\n      <h2 class=\"reveal\" style=\"margin: 0 0 16px; font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 38px; letter-spacing: -0.02em; line-height: 1.1\">Common questions<\u002Fh2>\n      <p style=\"margin: 0; color: #3E4247; font-size: 17px\">Anything else, call <a href=\"tel:+61417076667\" style=\"font-weight: 600\">0417 076 667<\u002Fa>. An engineer answers.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex: 2 1 520px; min-width: 0\">\n      <details class=\"reveal\" style=\"border-top: 1px solid #D9DAD6; padding: 20px 0\" open=\"\">\n        <summary style=\"font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 19px\">Do you take one-offs, or only volume runs?<\u002Fsummary>\n        <p style=\"margin: 10px 0 0; color: #3E4247; font-size: 15.5px\">Both. We tool for production most weeks, and we take prototype and one-off work, especially when you are sizing up a larger run or replacing a discontinued part.<\u002Fp>\n      <\u002Fdetails>\n      <details class=\"reveal\" style=\"border-top: 1px solid #D9DAD6; padding: 20px 0\">\n        <summary style=\"font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 19px\">Can you reverse-engineer a part we currently import?<\u002Fsummary>\n        <p style=\"margin: 10px 0 0; color: #3E4247; font-size: 15.5px\">Yes. Send the part, or photos and dimensions, with the application notes. Much of our work replaces imported components at similar or lower landed cost.<\u002Fp>\n      <\u002Fdetails>\n      <details class=\"reveal\" style=\"border-top: 1px solid #D9DAD6; padding: 20px 0\">\n        <summary style=\"font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 19px\">What sizes can you make?<\u002Fsummary>\n        <p style=\"margin: 10px 0 0; color: #3E4247; font-size: 15.5px\">From fish-spine beads a few millimetres across to wet-pressed porcelain parts weighing several kilograms. With a drawing, we can confirm tooling and forming method on the first call.<\u002Fp>\n      <\u002Fdetails>\n      <details class=\"reveal\" style=\"border-top: 1px solid #D9DAD6; border-bottom: 1px solid #D9DAD6; padding: 20px 0\">\n        <summary style=\"font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 19px\">Do you export?<\u002Fsummary>\n        <p style=\"margin: 10px 0 0; color: #3E4247; font-size: 15.5px\">Yes, to Africa, Asia and the USA, with the shipping documentation and QA standards overseas customers require.<\u002Fp>\n      <\u002Fdetails>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- Quote -->\n  <section id=\"quote\" style=\"background: #FFFFFF; border-top: 1px solid #D9DAD6\">\n    <div style=\"max-width: 1240px; margin: 0 auto; padding: 88px 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 56px\">\n      <div style=\"display: flex; flex-direction: column; gap: 20px\">\n        <h2 class=\"reveal\" style=\"margin: 0; font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 38px; letter-spacing: -0.02em; line-height: 1.1\">Tell us about the part.<\u002Fh2>\n        <p style=\"margin: 0; color: #3E4247; font-size: 17px\">A drawing, a sample or a description of what is failing is enough to start. We reply within two business days with whether we can make it, how, and at what price.<\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 6px; font-size: 15.5px; margin-top: 12px\">\n : grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 56px\">\n      <div style=\"display: flex; flex-direction: column; gap: 20px\">\n        <h2 class=\"reveal\" style=\"margin: 0; font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 38px; letter-spacing: -0.02em; line-height: 1.1\">We recommend the cheapest body that meets the spec.<\u002Fh2>\n        <p style=\"margin: 0; color: #3E4247; font-size: 17px\">Tell us the operating temperature, chemical environment, mechanical load, electrical requirements and budget. Our technical team will match it to one of 19 bodies, or formulate a new one with our mineral suppliers and labs.<\u002Fp>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 12px 28px; margin-top: 8px\">\n          <a href=\"#materials\" style=\"font-weight: 600; padding: 12px 0\">Materials guide →<\u002Fa>\n          <a id=\"brochure\" href=\"#brochure\" style=\"font-weight: 600; padding: 12px 0\">Download the brochure (PDF) →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #55595F; padding-bottom: 12px\">Ceramic bodies<\u002Fdiv>\n        <div class=\"grow\" style=\"height: 2px; background: #15171A\"><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); column-gap: 32px\">\n          \n            <div style=\"padding: 11px 0; border-bottom: 1px solid #E6E7E3; font-size: 15px\">{{b}}<\u002Fdiv>\n          \n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  \n  <section id=\"industries\" style=\"max-width: 1240px; margin: 0 auto; padding: 88px 32px\">\n    <h2 class=\"reveal\" style=\"margin: 0 0 40px; font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 38px; letter-spacing: -0.02em; line-height: 1.1\">Where our parts go<\u002Fh2>\n    <div style=\"disp ally runs. Stocked locally, on lead time.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  \n  <section id=\"about\" style=\"background: #15171A; color: #F5F5F3\">\n    <div style=\"max-width: 1240px; margin: 0 auto; padding: 88px 32px\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px 56px; margin-bottom: 48px; align-items: end\">\n        <h2 class=\"reveal\" style=\"margin: 0; font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 38px; letter-spacing: -0.02em; line-height: 1.1\">From drawing to despatch<\u002Fh2>\n        <p style=\"margin: 0; color: #C9CBC7; font-size: 17px\">We design and control every body, tool and QA check, then match production to the right facility in Australia, India, China or the USA. Where a job needs Australian manufacture, we scope it that way.<\u002Fp>\n      <\u002Fdiv>\n      <ol style=\"list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 32px\">\n        <li class=\"reveal\" style=\"border-top: 1px solid #55595F; padding-top: 18px\">\n          <div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12.5px; color: #8FB2E0; margin-bottom: 10px\">Within 2 business days<\u002Fdiv>\n          <h3 style=\"margin: 0 0 8px; font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 20px\">Assess<\u002Fh3>\n          <p style=\"margin: 0; color: #C9CBC7; font-size: 15px\">Send drawings, samples, photos or a description of what is failing. We confirm whether ceramic suits the job.<\u002Fp>\n        <\u002Fli>\n        <li class=\"reveal\" style=\"border-top: 1px solid #55595F; padding-top: 18px\">\n          <div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12.5px; color: #8FB2E0; margin-bottom: 10px\">Engineering<\u002Fdiv>\n          <h3 style=\"margin: 0 0 8px; font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 20px\">Specify<\u002Fh3>\n          <p style=\"margin: 0; color: #C9CBC7; font-size: 15px\">We recommend the body, forming method and firing schedule that fit your run size and budget.<\u002Fp>\n        <\u002Fli>\n        <li class=\"reveal\" style=\"border-top: 1px solid #55595F; padding-top: 18px\">\n          <div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12.5px; color: #8FB2E0; margin-bottom: 10px\">Firm quote<\u002Fdiv>\n          <h3 style=\"margin: 0 0 8px; font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 20px\">Prototype<\u002Fh3>\n          <p style=\"margin: 0; color: #C9CBC7; font-size: 15px\">A fixed price with a realistic lead time. New geometries are prototyped and proven before volume tooling.<\u002Fp>\n        <\u002Fli>\n        <li class=\"reveal\" style=\"border-top: 1px solid #55595F; padding-top: 18px\">\n          <div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12.5px; color: #8FB2E0; margin-bottom: 10px\">QA before despatch<\u002Fdiv>\n          <h3 style=\"margin: 0 0 8px; font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 20px\">Produce<\u002Fh3>\n          <p style=\"margin: 0; color: #C9CBC7; font-size: 15px\">Dimensional and material checks on every batch. Re-orders are simple because the body and tooling are ours.<\u002Fp>\n        <\u002Fli>\n      <\u002Fol>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  \n  <section id=\"tech\" style=\"max-width: 1240px; margin: 0 auto; padding: 88px 32px; display: flex; flex-wrap: wrap; gap: 40px 56px\">\n    <div style=\"flex: 1 1 320px\">\n      <h2 class=\"reveal\" style=\"margin: 0 0 16px; font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 38px; letter-spacing: -0.02em; line-height: 1.1\">Common questions<\u002Fh2>\n      <p style=\"margin: 0; color: #3E4247; font-size: 17px\">Anything else, call <a href=\"tel:+61417076667\" style=\"font-weight: 600\">0417 076 667<\u002Fa>. An engineer answers.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex: 2 1 520px; min-width: 0\">\n      <details class=\"reveal\" style=\"border-top: 1px solid #D9DAD6; padding: 20px 0\" open=\"\">\n        <summary style=\"font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 19px\">Do you take one-offs, or only volume runs?<\u002Fsummary>\n        <p style=\"margin: 10px 0 0; color: #3E4247; font-size: 15.5px\">Both. We tool for production most weeks, and we take prototype and one-off work, especially when you are sizing up a larger run or replacing a discontinued part.<\u002Fp>\n      <\u002Fdetails>\n      <details class=\"reveal\" style=\"border-top: 1px solid #D9DAD6; padding: 20px 0\">\n        <summary style=\"font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 19px\">Can you reverse-engineer a part we currently import?<\u002Fsummary>\n        <p style=\"margin: 10px 0 0; color: #3E4247; font-size: 15.5px\">Yes. Send the part, or photos and dimensions, with the application notes. Much of our work replaces imported components at similar or lower landed cost.<\u002Fp>\n      <\u002Fdetails>\n      <details class=\"reveal\" style=\"border-top: 1px solid #D9DAD6; padding: 20px 0\">\n        <summary style=\"font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 19px\">What sizes can you make?<\u002Fsummary>\n        <p style=\"margin: 10px 0 0; color: #3E4247; font-size: 15.5px\">From fish-spine beads a few millimetres across to wet-pressed porcelain parts weighing several kilograms. With a drawing, we can confirm tooling and forming method on the first call.<\u002Fp>\n      <\u002Fdetails>\n      <details class=\"reveal\" style=\"border-top: 1px solid #D9DAD6; border-bottom: 1px solid #D9DAD6; padding: 20px 0\">\n        <summary style=\"font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 19px\">Do you export?<\u002Fsummary>\n        <p style=\"margin: 10px 0 0; color: #3E4247; font-size: 15.5px\">Yes, to Africa, Asia and the USA, with the shipping documentation and QA standards overseas customers require.<\u002Fp>\n      <\u002Fdetails>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  \n  <section id=\"quote\" style=\"background: #FFFFFF; border-top: 1px solid #D9DAD6\">\n    <div style=\"max-width: 1240px; margin: 0 auto; padding: 88px 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 56px\">\n      <div style=\"display: flex; flex-direction: column; gap: 20px\">\n        <h2 class=\"reveal\" style=\"margin: 0; font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 38px; letter-spacing: -0.02em; line-height: 1.1\">Tell us about the part.<\u002Fh2>\n        <p style=\"margin: 0; color: #3E4247; font-size: 17px\">A drawing, a sample or a description of what is failing is enough to start. We reply within two business days with whether we can make it, how, and at what price.<\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 6px; font-size: 15.5px; margin-top: 12px\">\n          <a href=\"tel:+61417076667\" style=\"font-weight: 600; font-size: 20px; font-family: 'Archivo', sans-serif; text-decoration: none\">0417 076 667<\u002Fa>\n          <span style=\"color: #55595F\">45 Evans Street, Balmain NSW 2041<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <form style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px 20px\">\n        <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500\">Name\n          <input type=\"text\" style=\"font: inherit; font-weight: 400; font-size: 16px; padding: 12px 14px; border: 1px solid #A9ACA6; border-radius: 2px; background: #FFFFFF\">\n        <\u002Flabel>\n        <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500\">Company\n          <input type=\"text\" style=\"font: inherit; font-weight: 400; font-size: 16px; padding: 12px 14px; border: 1px solid #A9ACA6; border-radius: 2px; background: #FFFFFF\">\n        <\u002Flabel>\n        <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500\">Email\n          <input type=\"email\" style=\"font: inherit; font-weight: 400; font-size: 16px; padding: 12px 14px; border: 1px solid #A9ACA6; border-radius: 2px; background: #FFFFFF\">\n        <\u002Flabel>\n        <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500\">Phone\n          <input type=\"tel\" style=\"font: inherit; font-weight: 400; font-size: 16px; padding: 12px 14px; border: 1px solid #A9ACA6; border-radius: 2px; background: #FFFFFF\">\n        <\u002Flabel>\n        <label style=\"grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500\">Application and requirements\n          <textarea rows=\"4\" style=\"font: inherit; font-weight: 400; font-size: 16px; padding: 12px 14px; border: 1px solid #A9ACA6; border-radius: 2px; background: #FFFFFF; resize: vertical\"><\u002Ftextarea>\n        <\u002Flabel>\n        <label style=\"grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500\">Drawings or photos (PDF, DWG, STEP, JPG)\n          <input type=\"file\" style=\"font: inherit; font-weight: 400; font-size: 15px; padding: 12px 14px; border: 1px dashed #A9ACA6; border-radius: 2px; background: #F5F5F3\">\n        <\u002Flabel>\n        <div style=\"grid-column: 1 / -1\">\n          <button class=\"btn\" type=\"button\" style=\"font: inherit; font-weight: 600; font-size: 16px; background: #1C4F8F; color: #FFFFFF; border: 0; border-radius: 2px; padding: 15px 28px; cursor: pointer\">Send enquiry<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fform>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  \n  <footer style=\"background: #15171A; color: #C9CBC7; font-size: 14px\">\n    <div style=\"max-width: 1240px; margin: 0 auto; padding: 56px 32px 32px; display: gri sform: uppercase; color: #8C9096\">Contact<\u002Fspan>\n        <a href=\"tel:+61417076667\" style=\"color: #FFFFFF; text-decoration: none\">0417 076 667<\u002Fa>\n        <span>45 Evans Street<br>Balmain NSW 2041<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width: 1240px; margin: 0 auto; padding: 20px 32px 32px; border-top: 1px solid #33373C; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; font-size: 12.5px; color: #8C9096\">\n      <span>© 2026 Technical Ceramics Australia. Southern Equity Traders Pty Limited, ABN 61 096 414 345.<\u002Fspan>\n      <span>Privacy · Terms<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fsc-if><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1C4F8F&quot;,&quot;options&quot;:[&quot;#1C4F8F&quot;,&quot;#15171A&quot;,&quot;#9A3B1B&quot;,&quot;#2F5D50&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:6900}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      accent: this.props.accent ?? '#1C4F8F',\n      products: [\n        { name: 'Alumina ceramics', spec: '92–99.8% Al₂O₃', detail: 'Wear-resistant plates, tubes and formed shapes, fired in continuous tunnel kilns.' },\n        { name: 'Ceramic and porcelain insulators', spec: 'Glazed HV', detail: 'Power parts, porcelain bodies, glazed high-voltage insulators and ceramic heat sinks.' },\n        { name: 'Silicon carbide', spec: 'Rollers >1000 mm', detail: 'Kiln muffles, tubes, liners, plates and diamond-lapped rollers. Over 30 years of SiC manufacture.' },\n        { name: 'Ballistic ceramics', spec: 'B₄C · SiC · Al₂O₃', detail: 'Armour-grade tiles and plates, reaction bonded or isostatically pressed to your platform.' },\n        { name: 'Wire wound resistors', spec: 'D- and V-type', detail: 'Fixed, adjustable and variable power resistors, including rheosta de' }\n      ],\n      bodies: ['96% alumina', 'Zirconia toughened alumina (ZTA)', 'Zirconia', 'Silicon carbide', 'Silicon nitride', 'Aluminium nitride', 'Boron nitride', 'Zircon', 'Mullite', 'Porcelain', 'Steatite', 'Low-loss steatite', 'Crushable steatite', 'Dense cordierite', 'Self-glazing cordierite', 'Aluminous cordierite', 'Zircon cordierite', '85% magnesium oxide', 'Refractories']\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
